# Base24 scheme for SlowBurnBot
# Spec: https://github.com/tinted-theming/home/blob/main/styling.md
system: "base24"
name: "Slow Burn Bot"
slug: "slowburnbot"
author: "SlowBurnBot"
variant: "dark"
palette:
  # Monotones
  base00: "141413"  # Default Background        — centered content container
  base01: "1c1b1a"  # Lighter Background        — panel / table body
  base02: "242322"  # Selection Background      — section headers, row hover, select option bg
  base03: "3d3d3a"  # Comments / Line Highlight — borders, dividers
  base04: "9a968b"  # Dark Foreground           — secondary / muted text
  base05: "f4f3ee"  # Default Foreground        — primary text
  base06: "faf9f4"  # Light Foreground          — (reserved)
  base07: "ffffff"  # Light Background          — nav/tab hover
  # Accents
  base08: "e87755"  # Red                       — bad-control hover
  base09: "b58fbf"  # Orange                    — (reserved)
  base0A: "e5c07b"  # Yellow                    — counts, warm highlights, warning status
  base0B: "a0b87c"  # Green                     — success
  base0C: "7aaa96"  # Cyan                      — (reserved)
  base0D: "8aa5c4"  # Blue                      — (reserved)
  base0E: "d97757"  # Purple                    — links, CTAs, focus rings, accent
  base0F: "a8765a"  # Brown                     — (reserved)
  # Extensions
  base10: "0d0c0c"  # Darker Background         — page bg (behind the container)
  base11: "2e2d2b"  # Brighter Background       — dropdown row hover, small buttons
  # Brights
  base12: "cf3b0a"  # Bright Red                — error / destructive
  base13: "f1d49a"  # Bright Yellow             — warning-control hover
  base14: "bdd498"  # Bright Green              — (reserved)
  base15: "a0ccbc"  # Bright Cyan               — (reserved)
  base16: "aec2dc"  # Bright Blue               — (reserved)
  base17: "cdadd4"  # Bright Purple             — (reserved)
